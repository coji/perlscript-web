sub save_threads {
    open STORE_OUT, ">storage:local:perlscript-web/2ch/threads-v3";
    print STORE_OUT encode_json(@threads);
}

sub load_threads {
    $stored_threads = <STORE_IN>;
    if ($stored_threads ne "") { @threads = decode_json($stored_threads); }
    else { seed_threads(); save_threads(); }
}

sub visit {
    $route = <ROUTE>;
    $last_visit = $now;
    open VISIT_OUT, ">storage:local:perlscript-web/2ch/last-visit";
    print VISIT_OUT $last_visit;
}

sub tick { $now = <CLOCK>; }

sub find_thread {
    $current_thread = "";
    $current_board = "php";
    if ($route =~ /^\/test\/read\.cgi\/([^\/]+)\/([0-9]+)\/?$/) { $current_board = $1; $current_thread = $2; }
}

sub create_thread {
    return if $subject eq "";
    return if $message eq "";
    $author = $name;
    $author = "名無しさん" if $author eq "";
    $new_id = $now;
    %post = ("name", $author, "mail", $mail, "date", "UNIX $now", "body", $message);
    @new_posts = (%post);
    $current_board = "php";
    if ($route =~ /^\/test\/new\.cgi\/([^\/]+)\/?$/) { $current_board = $1; }
    %new_thread = ("board", $current_board, "id", $new_id, "title", $subject, "posts", @new_posts);
    push(@threads, %new_thread);
    save_threads();
    $subject = "";
    $message = "";
    print ROUTE "/test/read.cgi/$current_board/$new_id/";
}

sub reply {
    return if $message eq "";
    find_thread();
    return if $current_thread eq "";
    $author = $name;
    $author = "名無しさん" if $author eq "";
    $i = 0;
    while ($i <= $#threads) {
        %thread = $threads[$i];
        if ($thread{board} eq $current_board && $thread{id} eq $current_thread) {
            @posts = $thread{posts};
            %post = ("name", $author, "mail", $mail, "date", "UNIX $now", "body", $message);
            push(@posts, %post);
            $thread{posts} = @posts;
            $threads[$i] = %thread;
        }
        $i++;
    }
    save_threads();
    $message = "";
}

sub reset_demo {
    seed_threads();
    save_threads();
    $message = "";
    $subject = "";
    print ROUTE "/$current_board/";
}

sub set_current_board {
    $current_board = "php";
    if ($route =~ /^\/([^\/]+)\/?$/) { $current_board = $1; }
    if ($route =~ /^\/([^\/]+)\/subback\.html$/) { $current_board = $1; }
    if ($route =~ /^\/test\/new\.cgi\/([^\/]+)\/?$/) { $current_board = $1; }
    if ($route =~ /^\/test\/read\.cgi\/([^\/]+)\/[0-9]+\/?$/) { $current_board = $1; }
}

    $board_label = "WEBプログラミング";

    if ($current_board eq "hp") { $board_label = "Web制作"; }

}

sub thread_preview {
    %thread = $_[0];
    @posts = $thread{posts};
    begin("section", "class", "thread-box"); key($thread{id});
    begin("h2"); begin("a", "href", "#/test/read.cgi/" . $current_board . "/" . $thread{id} . "/"); text($thread{title}); end(); end();
    $preview_i = 0;
    while ($preview_i <= $#posts && $preview_i < 3) {
        %post = $posts[$preview_i];
        begin("article", "class", "post");
        begin("div", "class", "post-meta"); text($preview_i + 1); text(" 名前："); begin("strong"); text($post{name}); end(); text(" 投稿日："); text($post{date}); end();
        begin("p"); text($post{body}); end();
        end();
        $preview_i++;
    }
    begin("p", "class", "thread-jump"); begin("a", "href", "#/test/read.cgi/" . $current_board . "/" . $thread{id} . "/"); text("全部読む（" . ($#posts + 1) . "）"); end(); end();
    end();
}

    $board_count = 0;
    $count_i = 0;
    while ($count_i <= $#threads) { %count_thread = $threads[$count_i]; if ($count_thread{board} eq $current_board) { $board_count++; } $count_i++; }
    begin("p", "class", "board-note"); text("現在 " . $board_count . " スレッド／最終巡回 UNIX $last_visit"); end();
    $board_i = 0;
    while ($board_i <= $#threads) { %board_thread = $threads[$board_i]; if ($board_thread{board} eq $current_board) { thread_preview($threads[$board_i]); } $board_i++; }
    begin("p", "class", "new-thread-entry"); begin("a", "href", "#/test/new.cgi/" . $current_board . "/"); text("新規スレッド作成画面へ"); end(); end();
    end();
}

sub new_thread_view {
    board_header();
    begin("main", "class", "new-thread-page");
    begin("h2"); text("新規スレッド作成"); end();
    begin("p"); text("題名と本文を入力してください。名前とE-mailは省略できます。"); end();
    new_thread_form();
    end();
}

sub board_list_view {
    begin("main", "class", "board-list-page");
    begin("h1"); text("■ ２ちゃんねる掲示板 ■"); end();
    begin("p"); text("日本のWebとPerlが近かった時代を、PerlUIで巡回できます。"); end();
    begin("section", "class", "category"); begin("h2"); text("ＰＣ等"); end();
    begin("ul");
    begin("li"); begin("a", "href", "#/php/"); text("WEBプログラミング"); end(); text("　Perl / CGI / PHP"); end();
    begin("li"); begin("a", "href", "#/prog/"); text("プログラマー"); end(); text("　仕事 / コード / デスマ"); end();
    begin("li"); begin("a", "href", "#/unix/"); text("UNIX"); end(); text("　サーバ / シェル / 運用"); end();
    end(); end();
    begin("section", "class", "category"); begin("h2"); text("ネット関係"); end();
    begin("ul"); begin("li"); begin("a", "href", "#/hp/"); text("Web制作"); end(); text("　HTML / 素材 / ホームページ"); end(); begin("li"); begin("a", "href", "#/hosting/"); text("レンタルサーバ"); end(); text("　CGI / FTP / 鯖移転"); end(); end(); end();
    begin("p", "class", "enter-board"); text("板を選んで、2002年のWebを巡回してください。"); end();
    end();
}

sub subback_view {
    board_header();
    begin("main", "class", "subback"); begin("h2"); text(board_name() . "板＠スレッド一覧"); end();
    begin("ol");
    $i = 0;
    while ($i <= $#threads) {
        %thread = $threads[$i]; @posts = $thread{posts};
        if ($thread{board} eq $current_board) { begin("li"); begin("a", "href", "#/test/read.cgi/" . $current_board . "/" . $thread{id} . "/"); text($thread{title} . " (" . ($#posts + 1) . ")"); end(); end(); }
        $i++;
    }
    end();
    end();
}

sub reply_form {
    begin("form", "class", "composer reply-form"); on("submit", "reply");
    begin("div", "class", "field-row");
    begin("label"); text("名前："); begin("input", "id", "reply-name", "size", "20"); bind("value", "name"); end(); end();
    begin("label"); text("E-mail："); begin("input", "id", "reply-mail", "size", "20"); bind("value", "mail"); end(); end();
    end();
    begin("label", "class", "message-label"); begin("span"); text("本文："); end(); begin("textarea", "id", "reply-message", "rows", "5", "cols", "64", "aria-required", "true"); bind("value", "message"); end(); end();
    begin("button", "id", "reply-submit", "type", "submit"); text("書き込む"); end();
    end();
}

sub thread_view {
    board_header();
    find_thread();
    $found = 0;
    begin("main", "class", "thread-page");
    $i = 0;
    while ($i <= $#threads) {
        %thread = $threads[$i];
        if ($thread{board} eq $current_board && $thread{id} eq $current_thread) {
            $found = 1;
            begin("section", "class", "thread-box full-thread");
            begin("h2"); text($thread{title}); end();
            @posts = $thread{posts};
            $j = 0;
            while ($j <= $#posts) {
                %post = $posts[$j];
                begin("article", "class", "post"); key($j + 1);
                begin("div", "class", "post-meta"); text($j + 1); text(" 名前："); begin("strong"); text($post{name}); end(); text(" 投稿日："); text($post{date}); end();
                begin("p"); text($post{body}); end();
                end();
                $j++;
            }
            end();
            reply_form();
        }
        $i++;
    }
    if (!$found) { begin("p"); text("そのスレッドはありません。"); end(); }
    end();
}

sub footer_view {
    begin("footer", "class", "site-footer");
    begin("p"); begin("a", "href", "#/" . $current_board . "/"); text("掲示板に戻る"); end(); text(" ｜ "); begin("a", "href", "#/" . $current_board . "/subback.html"); text("過去ログ倉庫"); end(); text(" ｜ "); begin("button", "type", "button"); on("click", "reset_demo"); text("デモを初期化"); end(); end();
    begin("p"); text("archive-inspired demo · current board: " . $current_board . " · application: Perl 1.0-shaped source"); end();
    end();
}

sub view {
    set_current_board();
    begin("div", "class", "archive-page");
    if ($route eq "/") { board_list_view(); }
    if ($route =~ /^\/(php|prog|unix|hp|hosting)\/?$/) { board_view(); }
    if ($route =~ /^\/(php|prog|unix|hp|hosting)\/subback\.html$/) { subback_view(); }
    if ($route =~ /^\/test\/new\.cgi\/(php|prog|unix|hp|hosting)\/?$/) { new_thread_view(); }
    if ($route =~ /^\/test\/read\.cgi\/(php|prog|unix|hp|hosting)\/[0-9]+\/?$/) { thread_view(); }
    footer_view();
    end();
}

open APP, ">ui:#app-root";
open ROUTE, "route:hash";
open CLOCK, "clock:60000";
open STORE_IN, "storage:local:perlscript-web/2ch/threads-v3";
open VISIT_IN, "storage:local:perlscript-web/2ch/last-visit";
$now = <CLOCK>;
$last_visit = <VISIT_IN>;
$last_visit = $now if $last_visit eq "";
load_threads();
do watch(ROUTE, "visit");

mount(APP, "view");
</script>
<script>
const perl = document.querySelector('#app');
const source = document.querySelector('#source');
const dialog = document.querySelector('#source-dialog');
const runButton = document.querySelector('#run');
const status = document.querySelector('#run-status');
const errorPanel = document.querySelector('#error');
let runCount = 0;
source.value = perl.textContent.trim();
const showError = error => {
  errorPanel.textContent = `${error.name}: ${error.message}\n${error.excerpt || ''}`;
  errorPanel.hidden = false;
};
PerlScript.setErrorHandler(showError);
async function run() {
  errorPanel.hidden = true;
  runButton.disabled = true;
  status.textContent = 'Running…';
  perl.textContent = source.value;
  perl.type = 'text/perl';
  await new Promise(requestAnimationFrame);
  try {
    await PerlScript.runScripts();
    runCount++;
    status.textContent = `Run ${runCount} complete`;
  } catch (error) {
    showError(error);
    status.textContent = 'Run failed — previous program is still active';
  } finally {
    runButton.disabled = false;
  }
}
document.querySelector('#open-source').addEventListener('click', () => dialog.showModal());
document.querySelector('#close-source').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
runButton.addEventListener('click', run);
run();
</script>
