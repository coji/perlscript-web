sub save_diaries { open DIARY_OUT, ">storage:local:perlscript-web/mixi/diaries-v2"; print DIARY_OUT encode_json(@diaries); }
sub save_footprints { open FOOT_OUT, ">storage:local:perlscript-web/mixi/footprints-v1"; print FOOT_OUT encode_json(@footprints); }
sub save_communities { open COMM_OUT, ">storage:local:perlscript-web/mixi/communities-v1"; print COMM_OUT encode_json(@communities); }

sub refresh_next_diary_id {
    $next_diary_id = 1;
    $id_i = 0;
    while ($id_i <= $#diaries) {
        %id_diary = $diaries[$id_i];
        if ($id_diary{id} >= $next_diary_id) { $next_diary_id = $id_diary{id} + 1; }
        $id_i++;
    }
}

sub load_data {
    $stored_diaries = <DIARY_IN>;
    $stored_footprints = <FOOT_IN>;
    $stored_communities = <COMM_IN>;
    seed_data();
    if ($stored_diaries ne "") { @diaries = decode_json($stored_diaries); }
    else { save_diaries(); }
    if ($stored_footprints ne "") { @footprints = decode_json($stored_footprints); }
    else { save_footprints(); }
    if ($stored_communities ne "") { @communities = decode_json($stored_communities); }
    else { save_communities(); }
    refresh_next_diary_id();
}

sub find_user {
    $wanted_user = $_[0];
    %found_user = ();
    $user_i = 0;
    while ($user_i <= $#users) { %candidate_user = $users[$user_i]; if ($candidate_user{id} eq $wanted_user) { %found_user = %candidate_user; } $user_i++; }
    return %found_user;
}

sub user_link {
    %linked_user = find_user($_[0]);
    begin("a", "href", "#/show_friend.pl?id=" . $linked_user{id}); text($linked_user{name}); end();
}

sub avatar {
    %avatar_user = find_user($_[0]);
    begin("img", "class", "avatar " . $_[1], "src", "./assets/mixi/member-" . $avatar_user{id} . ".webp", "alt", $avatar_user{name} . "のプロフィール画像"); end();
}

sub login { print ROUTE "/home.pl"; }

sub record_footprint {
    return if $view_user eq $current_user;
    %new_foot = ("owner", $view_user, "user", $current_user, "date", "UNIX $now");
    push(@footprints, %new_foot);
    save_footprints();
}

sub visit {
    $route = <ROUTE>;
    if ($route =~ /^\/show_friend\.pl\?id=([0-9]+)$/) { $view_user = $1; record_footprint(); }
}

sub tick { $now = <CLOCK>; }

sub create_diary {
    return if $diary_title eq "";
    return if $diary_body eq "";
    $new_diary_id = $next_diary_id;
    $next_diary_id++;
    @new_comments = ();
    %new_diary = ("id", $new_diary_id, "owner", $current_user, "date", "UNIX $now", "title", $diary_title, "body", $diary_body, "comments", @new_comments);
    @next_diaries = ();
    push(@next_diaries, %new_diary);
    $next_diary_i = 0;
    while ($next_diary_i <= $#diaries) { push(@next_diaries, $diaries[$next_diary_i]); $next_diary_i++; }
    @diaries = @next_diaries;
    save_diaries();
    $diary_title = "";
    $diary_body = "";
    print ROUTE "/view_diary.pl?id=$new_diary_id&owner_id=$current_user";
}

sub add_comment {
    return if $comment_body eq "";
    $current_diary = "";
    if ($route =~ /^\/view_diary\.pl\?id=([0-9]+)&owner_id=[0-9]+$/) { $current_diary = $1; }
    $comment_i = 0;
    while ($comment_i <= $#diaries) {
        %comment_diary = $diaries[$comment_i];
        if ($comment_diary{id} eq $current_diary) {
            @diary_comments = $comment_diary{comments};
            %new_comment = ("user", $current_user, "date", "UNIX $now", "body", $comment_body);
            push(@diary_comments, %new_comment);
            $comment_diary{comments} = @diary_comments;
            $diaries[$comment_i] = %comment_diary;
        }
        $comment_i++;
    }
    save_diaries();
    $comment_body = "";
}

sub add_topic_reply {
    return if $topic_body eq "";
    $current_community = "";
    if ($route =~ /^\/view_community\.pl\?id=([0-9]+)$/) { $current_community = $1; }
    $comm_i = 0;
    while ($comm_i <= $#communities) {
        %reply_comm = $communities[$comm_i];
        if ($reply_comm{id} eq $current_community) {
            @reply_topics = $reply_comm{topics};
            %new_topic = ("id", $now, "title", "Re: コミュニティの話題", "author", $current_user, "date", "UNIX $now", "body", $topic_body);
            @next_topics = ();
            push(@next_topics, %new_topic);
            $next_topic_i = 0;
            while ($next_topic_i <= $#reply_topics) { push(@next_topics, $reply_topics[$next_topic_i]); $next_topic_i++; }
            @reply_topics = @next_topics;
            $reply_comm{topics} = @reply_topics;
            $communities[$comm_i] = %reply_comm;
        }
        $comm_i++;
    }
    save_communities();
    $topic_body = "";
}

sub reset_demo {
    seed_data(); refresh_next_diary_id(); save_diaries(); save_footprints(); save_communities();
    $diary_title = ""; $diary_body = ""; $comment_body = ""; $topic_body = "";
    print ROUTE "/home.pl";
}

sub view {
    begin("div", "class", "mixi-page");
    if ($route eq "/" || $route eq "/login.pl") { login_view(); }
    if ($route eq "/home.pl") { home_view(); }
    if ($route =~ /^\/show_friend\.pl\?id=[0-9]+$/) { profile_view(); }
    if ($route =~ /^\/list_diary\.pl\?id=[0-9]+$/) { diary_list_view(); }
    if ($route eq "/add_diary.pl") { add_diary_view(); }
    if ($route =~ /^\/view_diary\.pl\?id=[0-9]+&owner_id=[0-9]+$/) { diary_view(); }
    if ($route eq "/show_log.pl") { footprints_view(); }
    if ($route eq "/list_community.pl") { communities_view(); }
    if ($route =~ /^\/view_community\.pl\?id=[0-9]+$/) { community_view(); }
    if ($route eq "/list_message.pl") { messages_view(); }
    if ($route ne "/" && $route ne "/login.pl") { footer_view(); }
    end();
}

<script>
const perl = document.querySelector('#app');
const source = document.querySelector('#source');
const dialog = document.querySelector('#source-dialog');
const runButton = document.querySelector('#run');
const status = document.querySelector('#run-status');
const errorPanel = document.querySelector('#error');
let runCount = 0;
source.value = perl.textContent.trim();
const showError = error => {
  errorPanel.textContent = `${error.name}: ${error.message}\n${error.excerpt || ''}`;
  errorPanel.hidden = false;
};
PerlScript.setErrorHandler(showError);
async function run() {
  errorPanel.hidden = true;
  runButton.disabled = true;
  status.textContent = 'Running…';
  perl.textContent = source.value;
  perl.type = 'text/perl';
  await new Promise(requestAnimationFrame);
  try {
    await PerlScript.runScripts();
    runCount++;
    status.textContent = `Run ${runCount} complete`;
  } catch (error) {
    showError(error);
    status.textContent = 'Run failed — previous program is still active';
  } finally {
    runButton.disabled = false;
  }
}
document.querySelector('#open-source').addEventListener('click', () => dialog.showModal());
document.querySelector('#close-source').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
runButton.addEventListener('click', run);
run();
</script>
