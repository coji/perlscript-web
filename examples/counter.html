<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PerlUI Counter</title>
<style>
  /* Hallmark · pre-emit critique: P4 H5 E5 S5 R5 V4 */
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:clip}
  body{min-height:100dvh;background:#f6f7fb;color:#18181b;font:15px/1.55 Inter,ui-sans-serif,system-ui}
  main{min-height:calc(100dvh - 60px)}
  .pane{padding:24px max(20px,env(safe-area-inset-left)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-right))}
  .code{background:#17171c;color:#ececf1}
  .eyebrow{font-weight:700;color:#c4b5fd;letter-spacing:.12em;text-transform:uppercase}
  h1{font-size:clamp(32px,5vw,64px);line-height:1;margin:.3em 0}
  .toolbar,.file-meta{display:flex;align-items:center}
  .toolbar{justify-content:space-between;gap:16px;margin:16px 0}
  .file-meta{gap:10px}
  .run-status{color:#a1a1aa;font:12px/1.4 ui-monospace,SFMono-Regular,monospace}
  .run-status[data-state="running"]{color:#fde68a}
  .run-status[data-state="success"]{color:#86efac}
  .run-status[data-state="error"]{color:#fca5a5}
  button{white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .run{min-height:44px;border:0;border-radius:999px;background:#7c3aed;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}
  .run:disabled{cursor:wait;opacity:.7}
  .editor{width:100%;min-height:420px;resize:none;border:1px solid #34343c;border-radius:16px;background:#222228;color:#f4f4f5;padding:16px;font:16px/1.6 ui-monospace,SFMono-Regular,monospace}
  .error{margin:0 0 16px;border:1px solid #f87171;border-radius:12px;background:#450a0a;color:#fecaca;padding:12px 14px}
  .error strong{display:block;margin-bottom:4px}
  .error pre{margin:0;overflow:auto;white-space:pre-wrap;font:12px/1.5 ui-monospace,SFMono-Regular,monospace}
  .preview{display:grid;place-items:center;min-height:min(32rem,calc(100dvh - 108px))}
  .counter{width:min(100%,440px);padding:32px 24px;border:1px solid #e4e4e7;border-radius:24px;background:#fff;box-shadow:0 20px 60px #18181b12;text-align:center}
  .counter h1{margin:0 0 12px;font-size:clamp(32px,10vw,42px);overflow-wrap:anywhere}
  .counter p{color:#71717a}
  .counter button{min-height:48px;margin-top:18px;border:0;border-radius:999px;background:#7c3aed;color:#fff;padding:14px 22px;font:700 16px/1 system-ui;cursor:pointer}
  .mobile-switch{position:sticky;inset-block-start:0;z-index:10;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:8px max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left));background:#17171c}
  .mobile-switch button{min-height:44px;border:1px solid #34343c;border-radius:10px;background:transparent;color:#a1a1aa;font-weight:700;cursor:pointer}
  .mobile-switch button[aria-pressed="true"]{border-color:#7c3aed;background:#7c3aed;color:#fff}
  .run:focus-visible,.mobile-switch button:focus-visible,.counter button:focus-visible,.editor:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
  .run:active,.mobile-switch button:active,.counter button:active{transform:translateY(1px)}
  body[data-mobile-pane="preview"] .source-pane,body[data-mobile-pane="source"] .preview-pane{display:none}
  .preview[data-run-state="success"]{animation:rerun 500ms ease-out}
  @keyframes rerun{from{outline:3px solid #a78bfa;outline-offset:-3px}to{outline:3px solid transparent;outline-offset:12px}}
  @media(min-width:53.125rem){.mobile-switch{display:none}main{display:grid;grid-template-columns:minmax(360px,1fr) minmax(360px,1fr);min-height:100dvh}.source-pane,.preview-pane{display:block!important}.pane{padding:clamp(20px,4vw,56px)}.editor{min-height:600px;resize:vertical;padding:20px;font-size:14px}.preview{min-height:calc(100dvh - 2 * clamp(20px,4vw,56px))}.counter{width:min(92%,440px);padding:42px}}
  @media(prefers-reduced-motion:reduce){.preview[data-run-state="success"]{animation:none}}
</style>
<body data-mobile-pane="preview">
<nav class="mobile-switch" aria-label="Counter workspace view"><button type="button" data-pane="source" aria-pressed="false">Source</button><button type="button" data-pane="preview" aria-pressed="true">Preview</button></nav>
<main>
  <section class="pane code source-pane">
    <div class="eyebrow">1987 → 2026</div>
    <h1>Perl is the UI.</h1>
    <p>Edit the Perl source, then run it. The live interface on the right follows the scalar.</p>
    <div class="toolbar">
      <div class="file-meta"><span>counter.pl</span><span class="run-status" id="run-status" role="status" aria-live="polite">Starting…</span></div>
      <button class="run" id="run" type="button">Run Perl</button>
    </div>
    <div class="error" id="error" role="alert" hidden><strong id="error-title"></strong><pre id="error-detail"></pre></div>
    <textarea class="editor" id="source" aria-label="Perl source" spellcheck="false"></textarea>
  </section>
  <section class="pane preview-pane">
    <div class="preview" id="preview"><div id="app-root"></div></div>
  </section>
</main>
<script src="../dist/perlscript-web.js"></script>
<script id="app" type="text/plain" data-perlscript>
$count = 0;

sub increment {
    $count++;
}

sub view {
    begin("main", "class", "counter");
    begin("h1"); text("Perl Counter"); end();
    begin("p"); text("The state is an ordinary Perl scalar."); end();
    begin("button", "type", "button");
    on("click", "increment");
    text("Count: $count");
    end();
    end();
}

open APP, ">ui:#app-root";
mount(APP, "view");
</script>
<script>
  const perl = document.querySelector('#app');
  const editor = document.querySelector('#source');
  const errorPanel = document.querySelector('#error');
  const errorTitle = document.querySelector('#error-title');
  const errorDetail = document.querySelector('#error-detail');
  const runButton = document.querySelector('#run');
  const runStatus = document.querySelector('#run-status');
  const preview = document.querySelector('#preview');
  const paneButtons = [...document.querySelectorAll('[data-pane]')];
  let runCount = 0;

  const showPane = pane => {
    document.body.dataset.mobilePane = pane;
    paneButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.pane === pane)));
  };

  const showError = error => {
    errorTitle.textContent = `${error.name}: ${error.message}`;
    errorDetail.textContent = error.excerpt || '';
    errorPanel.hidden = false;
  };

  const run = async () => {
    errorPanel.hidden = true;
    runButton.disabled = true;
    runButton.textContent = 'Running…';
    runStatus.textContent = 'Running…';
    runStatus.dataset.state = 'running';
    delete preview.dataset.runState;
    perl.textContent = editor.value;
    perl.type = 'text/perl';
    await new Promise(requestAnimationFrame);
    try {
      await PerlScript.runScripts();
      runCount++;
      runStatus.textContent = `Run ${runCount} complete`;
      runStatus.dataset.state = 'success';
      preview.dataset.runState = 'success';
      showPane('preview');
    } catch (error) {
      showError(error);
      runStatus.textContent = 'Run failed';
      runStatus.dataset.state = 'error';
    } finally {
      runButton.disabled = false;
      runButton.textContent = 'Run Perl';
    }
  };

  PerlScript.setErrorHandler(showError);
  editor.value = perl.textContent.trim();
  paneButtons.forEach(button => button.addEventListener('click', () => showPane(button.dataset.pane)));
  runButton.addEventListener('click', run);
  run();
</script>
</body>
</html>
