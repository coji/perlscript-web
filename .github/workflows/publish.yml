name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: npm
      url: https://www.npmjs.com/package/perlscript-web/v/${{ steps.release.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:e2e
      - name: Resolve release version and npm channel
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
          CHANNEL=$(node -e "const v=require('./package.json').version; const m=v.match(/-([a-z][a-z0-9-]*)/i); process.stdout.write(m ? m[1] : 'latest')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Publish with npm Trusted Publishing
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.channel }}"
