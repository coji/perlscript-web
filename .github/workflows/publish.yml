name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
      - run: pnpm run check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:e2e
      - name: Verify release tag
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('release tag and package version differ')"
      - name: Publish package
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            pnpm publish --tag next --provenance
          else
            pnpm publish --provenance
          fi
